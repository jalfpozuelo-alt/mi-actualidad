name: Actualización de gobiernos
on:
  schedule:
    - cron: '53 6 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/collect-political-data.mjs, scripts/update-governments.mjs, config/**, public/data/eu-parliament.json, .github/workflows/governments.yml]
permissions: {contents: write}
concurrency: {group: governments-update, cancel-in-progress: false}
jobs:
  governments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Recopilando gobiernos y Parlamento Europeo
        run: node scripts/collect-political-data.mjs
      - name: Validar datos
        run: node -e "const x=require('./public/data/eu-governments.json'); if(!Array.isArray(x.governments)||x.governments.length!==27) process.exit(1)"
      - name: Publicar cambios
        run: |
          git config user.name "mi-actualidad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/eu-governments.json public/data/eu-parliament.json public/data/political-update-status.json
          git diff --cached --quiet || git commit -m "content: update EU government dataset"
          git push

