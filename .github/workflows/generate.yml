name: Generación de boletín
on:
  schedule: [{cron: '0 7 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: editorial-generation, cancel-in-progress: false}
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run collect-feeds
      - run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('generated/news-feed.json')); if(!x.schemaVersion||!Array.isArray(x.stories)) process.exit(1)"
      - run: echo 'Feed recopilado y validado; no se publica como edición final hasta revisión editorial.'

