name: Generación de boletín
# source catalog changes
on:
  schedule: [{cron: '0 6 * * *'}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config/**, scripts/**, .github/workflows/generate.yml]
permissions: {contents: write}
concurrency: {group: editorial-generation, cancel-in-progress: true}
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Recopilar y traducir titulares
        run: npm run collect-feeds
      - name: Recopilar efemérides del día
        run: node scripts/collect-on-this-day.mjs
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
      - run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('generated/news-feed.json')); if(!x.schemaVersion||!Array.isArray(x.stories)) process.exit(1)"
      - id: gate
        shell: bash
        run: |
          count=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('generated/news-feed.json')); process.stdout.write(String(x.stories.length))")
          if [ "$count" -gt 0 ]; then echo "has_stories=true" >> "$GITHUB_OUTPUT"; else echo "has_stories=false" >> "$GITHUB_OUTPUT"; echo "Sin titulares actuales; se conserva el último JSON válido."; fi
      - if: steps.gate.outputs.has_stories == 'true'
        run: mkdir -p public/data && cp generated/news-feed.json public/data/news-feed.json
      - run: mkdir -p public/data && cp generated/on-this-day.json public/data/on-this-day.json
      - run: |
          git config user.name "mi-actualidad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/on-this-day.json generated/translation-cache.json
          if [ "${{ steps.gate.outputs.has_stories }}" = "true" ]; then git add public/data/news-feed.json; fi
          git diff --cached --quiet || git commit -m "content: update free-source headlines [skip ci]"
          git push

