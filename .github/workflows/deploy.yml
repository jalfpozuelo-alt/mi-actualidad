name: Despliegue GitHub Pages
# Deploy after normal pushes and manual runs
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, actions: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  deploy:
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Confirmar que el artefacto está disponible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' || true)
            if [ -n "$artifact" ]; then
              sleep 5
              exit 0
            fi
            sleep 5
          done
          echo "El artefacto de Pages no estuvo disponible a tiempo" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4

